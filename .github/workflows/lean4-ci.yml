name: Lean 4 CI - Complete Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'lean4_formal_proofs/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'lean4_formal_proofs/**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # Run every Monday at midnight

jobs:
  lean4-verification:
    name: Complete Lean 4 Verification
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Lean 4 and Lake
      run: |
        echo "🔧 Installing Lean 4 and Lake..."
        curl -L https://raw.githubusercontent.com/leanprover/lean4/master/scripts/install.sh | bash
        echo "$HOME/.elan/bin" >> $GITHUB_PATH
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        lean --version
        lake --version

    - name: Install Mathlib4
      run: |
        echo "📚 Installing Mathlib4..."
        cd lean4_formal_proofs
        lake exe cache get

    - name: Compile all proofs
      run: |
        cd lean4_formal_proofs
        echo "🔍 Compiling all Lean 4 proofs..."
        lake build 2>&1 | tee full_compilation.log
        
        if grep -q "error" full_compilation.log; then
          echo "❌ Compilation failed"
          exit 1
        fi
        
        echo "✅ All proofs compiled successfully"

    - name: Check for sorry statements
      run: |
        cd lean4_formal_proofs
        echo "🔍 Checking for sorry statements..."
        SORRY_COUNT=$(grep -r "sorry" --include="*.lean" . | wc -l)
        
        if [ "$SORRY_COUNT" -gt 0 ]; then
          echo "❌ Found $SORRY_COUNT sorry statements:"
          grep -r "sorry" --include="*.lean" .
          exit 1
        else
          echo "✅ No sorry statements found"
        fi

    - name: Verify Part IV specifically
      run: |
        cd lean4_formal_proofs
        echo "🎯 Verifying Part IV proofs..."
        lake build Agora.PartIV 2>&1 | tail -10

    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lean4-ci-results
        path: lean4_formal_proofs/full_compilation.log
        retention-days: 7

    - name: Generate summary
      run: |
        echo "Lean 4 CI Summary" > ci_summary.txt
        echo "================" >> ci_summary.txt
        echo "Status: SUCCESS" >> ci_summary.txt
        echo "All proofs compiled and verified" >> ci_summary.txt
        echo "No sorry statements found" >> ci_summary.txt
        cat ci_summary.txt
