name: Agora CI Gate (T8.2 - Scientific Validation v2.0.0)

# Gate A (Lean Kernel Check): lake build Agora must return 0 errors
# Gate B (Ledger Regression): scripts/ci_ledger_regression.sh -- TODO.md regression block +
#         every checkers/test_*.py control suite (replaced the pre-ledger cross-consistency
#         script on T0 decision 2026-09-17; that script asserted retracted values)
# Gate C (Sorry-free core): No sorry stubs in build graph
# Gate D (Checker controls, pytest): pytest-collectable checker control suites, pipefail
# Blocks merge on failure per SocrateAI AGORA_GUIDELINES.md §3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-a-lean-kernel:
    name: "Gate A: Lean 4 Kernel Check"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install elan (Lean toolchain manager)
      run: |
        # 2026-09-17: the old lean4/master/scripts/install.sh URL returns 404; use elan-init.
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Report toolchain (from lean4_formal_proofs/lean-toolchain)
      working-directory: lean4_formal_proofs
      run: |
        lean --version
        lake --version

    - name: Install Mathlib4 pre-compiled binaries
      run: |
        echo "Installing Mathlib4 (cached)..."
        cd lean4_formal_proofs
        lake exe cache get || echo "Cache download failed, will rebuild"

    - name: Compile Agora namespace
      run: |
        cd lean4_formal_proofs
        echo "Compiling lean4_formal_proofs/Agora..."
        lake build Agora 2>&1 | tee gate_a_compilation.log

        # Check for compilation errors
        if grep -q "error:" gate_a_compilation.log; then
          echo "❌ GATE A FAILED: Lean 4 compilation errors detected"
          cat gate_a_compilation.log
          exit 1
        fi

        # Check for critical warnings
        if grep -qE "error|Error" gate_a_compilation.log; then
          echo "❌ GATE A FAILED"
          exit 1
        fi

        echo "✅ GATE A PASSED: lake build Agora compiled successfully (0 errors)"

    - name: Upload Lean compilation log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gate-a-lean-log
        path: lean4_formal_proofs/gate_a_compilation.log
        retention-days: 7

  gate-b-consistency:
    name: "Gate B: Ledger Regression"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install checker dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sympy==1.14.0 mpmath==1.3.0 numpy==2.2.6

    - name: Runner self-test (must detect a failing command)
      run: bash scripts/ci_ledger_regression.sh --self-test

    - name: Run ledger regression
      run: |
        set -o pipefail
        bash scripts/ci_ledger_regression.sh 2>&1 | tee gate_b_regression.log

    - name: Upload regression log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gate-b-regression-log
        path: gate_b_regression.log
        retention-days: 7

  gate-c-sorry-free:
    name: "Gate C: Sorry-Free Core"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check for sorry statements in build graph
      run: |
        echo "Scanning for sorry stubs in Agora core build graph..."
        CORE_PATH="lean4_formal_proofs/Agora"

        # Find all imported modules by traversing imports
        echo "Checking core Agora namespace..."

        # Count sorry stubs
        SORRY_COUNT=$(find "$CORE_PATH" -name "*.lean" -exec grep -l "^[[:space:]]*sorry" {} \; 2>/dev/null | wc -l)

        if [ "$SORRY_COUNT" -gt 0 ]; then
          echo "❌ GATE C WARNING: Found $SORRY_COUNT file(s) with sorry stubs"
          echo "Files with sorry:"
          find "$CORE_PATH" -name "*.lean" -exec grep -l "^[[:space:]]*sorry" {} \;

          # Check if orphaned (not imported)
          ORPHAN_COUNT=0
          for file in $(find "$CORE_PATH" -name "*.lean" -exec grep -l "^[[:space:]]*sorry" {} \;); do
            # Extract module name
            MODULE=$(basename "$file" .lean)

            # Check if imported elsewhere
            if ! grep -r "import.*$MODULE" "$CORE_PATH" --include="*.lean" > /dev/null 2>&1; then
              echo "  (orphaned, not imported): $file"
              ((ORPHAN_COUNT++))
            else
              echo "  (imported, needs attention): $file"
            fi
          done

          if [ "$ORPHAN_COUNT" -gt 0 ]; then
            echo "⚠️  GATE C: $ORPHAN_COUNT orphaned file(s) with sorry (not blocking per MEMORY.md §11)"
          else
            echo "❌ GATE C FAILED: Sorry stubs in active build modules"
            exit 1
          fi
        else
          echo "✅ GATE C PASSED: No sorry stubs in Agora core build graph"
        fi

    - name: Check Structures directory for orphaned files
      run: |
        echo "Checking for orphaned sorry stubs in Structures/ (non-blocking)..."
        if [ -f "lean4_formal_proofs/Structures/S20RecurrenceProof.lean" ]; then
          if grep -q "sorry" "lean4_formal_proofs/Structures/S20RecurrenceProof.lean"; then
            echo "⚠️  Note: S20RecurrenceProof.lean contains sorry but is orphaned (task T4.1/GAP-6)"
            echo "     Status: Non-blocking (not in build graph per MEMORY.md §11)"
          fi
        fi

  gate-pytest:
    name: "Gate D: Checker Controls (pytest)"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sympy==1.14.0 mpmath==1.3.0 numpy==2.2.6 pytest

    - name: Run pytest
      run: |
        # pipefail: before 2026-09-17 this step piped pytest into tee, so a failing test
        # still printed PASSED (observed on main: "1 failed, 5 passed" -> GATE D PASSED).
        # tests/test_stiffness_values.py (pre-ledger S12/S21 stiffness, sandboxed track,
        # CLAUDE.md rule 7) is not part of this gate.
        set -o pipefail
        pytest -v --tb=short -p no:cacheprovider \
          checkers/test_C1_mirror_integrality_controls.py \
          checkers/test_TW0_hodge_degree_controls.py \
          checkers/test_TW2A_n0_construction_controls.py \
          checkers/test_U1_witness_serialization_controls.py \
          2>&1 | tee gate_d_pytest.log

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gate-d-pytest-log
        path: gate_d_pytest.log
        retention-days: 7

  merge-gate:
    name: "Merge Gate - All Checks Required"
    runs-on: ubuntu-latest
    needs: [gate-a-lean-kernel, gate-b-consistency, gate-c-sorry-free, gate-pytest]
    if: always()

    steps:
    - name: Check all gates passed
      run: |
        echo "Evaluating all gates..."

        if [ "${{ needs.gate-a-lean-kernel.result }}" != "success" ]; then
          echo "❌ Gate A (Lean Kernel) FAILED"
          exit 1
        fi

        if [ "${{ needs.gate-b-consistency.result }}" != "success" ]; then
          echo "❌ Gate B (Ledger Regression) FAILED"
          exit 1
        fi

        if [ "${{ needs.gate-c-sorry-free.result }}" != "success" ]; then
          echo "❌ Gate C (Sorry-Free) FAILED"
          exit 1
        fi

        if [ "${{ needs.gate-pytest.result }}" != "success" ]; then
          echo "❌ Gate D (pytest) FAILED"
          exit 1
        fi

        echo "✅ ALL GATES PASSED"
        echo "✅ Repository is clean and ready for merge"
        echo "✅ Rule 2 (Strict Formalization): lake build Agora = 0 errors"
        echo "✅ Ledger regression + checker negative controls green"

    - name: Summary
      run: |
        echo "## CI Gate Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Gate A (Lean 4):** ${{ needs.gate-a-lean-kernel.result }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Gate B (Ledger Regression):** ${{ needs.gate-b-consistency.result }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Gate C (Sorry-Free):** ${{ needs.gate-c-sorry-free.result }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Gate D (Checker Controls):** ${{ needs.gate-pytest.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Merge Eligible:** YES" >> $GITHUB_STEP_SUMMARY
